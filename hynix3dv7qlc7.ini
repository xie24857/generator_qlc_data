qlc_region   = [0,1407]
qlc_mode = ratio
qlc_position_mode = none
qlc_parity_map = default
qlc_0  =0
qlc_1  =1
qlc_2  =0
qlc_3  =1
qlc_4  =0
qlc_5  =1
qlc_6  =0
qlc_7  =1
qlc_8  =0
qlc_9  =1
qlc_10 =0
qlc_11 =1
qlc_12 =0
qlc_13 =1
qlc_14 =0
qlc_15 =1

