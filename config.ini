; QLC 数据生成器配置文件

[flash]
; 一个 Block 中的总 Page 数（LP+MP+UP+XP 全部计入，必须是 4 的倍数）
page_count_in_block = 8480
; 单个 Page 大小（字节，包含 Data + OOB）
page_size = 19136
; QLC 16 级状态的格雷编码表（必须恰好 16 个值）
encoding = 15, 7, 5, 13, 12, 8, 9, 11, 3, 1, 0, 4, 6, 2, 10, 14

[strategy]
; ratio: 值为权重，0 表示不使用该状态
; count: 值为每个 WordLine 中该状态的精确数量，总和必须等于 page_size * 8
mode = ratio
0 = 1
1 = 0
2 = 1
3 = 0
4 = 1
5 = 0
6 = 1
7 = 0
8 = 1
9 = 0
10 = 1
11 = 0
12 = 1
13 = 0
14 = 1
15 = 0

[output]
; 留空则自动命名，格式: {mode}_{state}-{value}_...bin
; 文件名超过 250 字符时截断并加 hash
filename =
