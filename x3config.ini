; QLC 数据生成器配置文件
; 结构对齐 nand-flash-analyzer 的 x4config.ini

[device]
; ── 基本几何参数 ──────────────────────────────────────────────
cell_type          = QLC          ; 本次生成的 CellType：QLC / TLC / MLC / SLC
wordline_count     = 1416          ; WordLine 总数
page_count_in_block = 5544        ; 一个 Block 的总 Page 数（必须是 4 的倍数）
page_size          = 18816         ; 单个 Page 大小（字节）

; ══════════════════════════════════════════════════════════════
;  QLC（16 个状态，Gray code 须恰好 16 个值，首值一般为 15）
; ══════════════════════════════════════════════════════════════
; encoding：逻辑状态→4bit 值的映射，相邻状态编码只差 1 bit（Gray code）
; region：该 CellType 占用的 WL 范围，可多个不连续区间
; mode：count = 直接指定各状态数量；ratio = 按权重等比分配
; position_mode：none = 无约束（默认）；parity = 奇偶分离；half = 前后半分离
;   parity default：奇状态→奇数位置(1,3,5..)，偶状态→偶数位置(0,2,4..)
;   parity swap：   奇状态→偶数位置，偶状态→奇数位置
;   half   default：奇状态→前半(0..N/2-1)，偶状态→后半(N/2..N-1)
;   half   swap：   奇状态→后半，偶状态→前半
; parity_map：default / swap，控制奇偶映射方向（position_mode 非 none 时有效）
qlc_encoding = 15,7,6,4,12,8,0,2,3,1,5,13,9,11,10,14 
qlc_region   = [6,677],[702,1373]
qlc_mode = ratio
qlc_position_mode = none
qlc_parity_map = default
qlc_0  = 1
qlc_1  = 0
qlc_2  = 1
qlc_3  = 1
qlc_4  = 1
qlc_5  = 1
qlc_6  = 1
qlc_7  = 1
qlc_8  = 1
qlc_9  = 1
qlc_10 = 1
qlc_11 = 1
qlc_12 = 1
qlc_13 = 1
qlc_14 = 1
qlc_15 = 1

; ══════════════════════════════════════════════════════════════
; TLC（8 个状态，Gray code 须恰好 8 个值，首值一般为 7）
; ══════════════════════════════════════════════════════════════
tlc_encoding = 7,6,4,0,2,3,1,5
tlc_region   = [0,5],[678,701],[1374,1391]
tlc_mode = ratio
tlc_position_mode = none
tlc_parity_map = default
tlc_0 = 1
tlc_1 = 1
tlc_2 = 1
tlc_3 = 1
tlc_4 = 1
tlc_5 = 1
tlc_6 = 1
tlc_7 = 1

; ══════════════════════════════════════════════════════════════
; MLC（4 个状态，Gray code 须恰好 4 个值，首值一般为 3）
; ══════════════════════════════════════════════════════════════
; mlc_encoding = 3,2,0,1
; mlc_region   = [0,5]
; mlc_mode = count
; mlc_position_mode = none
; mlc_parity_map = default
; mlc_0 = 100
; mlc_1 = 200
; mlc_2 = 300
; mlc_3 = 400

; ══════════════════════════════════════════════════════════════
; SLC（2 个状态，Gray code 须恰好 2 个值，首值一般为 1）
; ══════════════════════════════════════════════════════════════
slc_encoding = 1,0
slc_region   = [1392,1415]
slc_mode = ratio
slc_position_mode = none
slc_parity_map = default
slc_0 = 1
slc_1 = 1



[threading]
; 线程数：0=关闭多线程，>0 则上限为核心数×2
thread_count = 0

[logger]
; 日志级别：TRACE / DEBUG / INFO / WARN / ERROR / FATAL
level       = INFO
; 是否静默（不输出到 stdout/stderr）
quiet       = false
; 是否线程安全
thread_safe = true
; 是否彩色输出
color       = true

[output]
; 指定输出文件名；留空则自动命名，格式: {YYYYMMDD_HHMMSS}_{cell_type}.bin
filename =
